# Root của uv workspace: cả repo là MỘT project, bốn thư mục là bốn package thành viên.
# `uv sync` ở đây tạo một `.venv` chung và cài cả bốn ở chế độ editable theo MỘT `uv.lock`.
# Root không có mã nguồn (package = false); chạy lệnh trong thư mục con vẫn dùng đúng .venv này.
[project]
name = "claude-agents"
version = "0.1.0"
description = "X-Agents: hai công ty AI (software-company, Studio-creators), gateway tài khoản và console trực ban"
requires-python = ">=3.11"
dependencies = [
    "console",
    "gateway",
    "software-company",
    "video-creators",
]

[project.optional-dependencies]
anthropic = ["software-company[anthropic]", "video-creators[anthropic]"]   # provider anthropic có key
graph = ["software-company[graph]"]                                          # langgraph, không cài trong CI

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",   # gateway (aiohttp)
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["console", "gateway", "software-company", "Studio-creators"]

[tool.uv.sources]
console = { workspace = true }
gateway = { workspace = true }
software-company = { workspace = true }
video-creators = { workspace = true }
