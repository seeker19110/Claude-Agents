# Cấu hình model TEXT cho runner/eval của `keeper`. Sao chép thành `llm.yaml` (BỊ GITIGNORE, không commit)
# hoặc dùng biến môi trường `KEEPER_*`. Công ty bảo trì trung lập provider: đổi model ở đây, không đổi code
# hay prompt (ADR-0003).
#
# anthropic | openai (mọi server OpenAI-compatible: OpenAI, OpenRouter, Ollama, Groq, vLLM...)
# | claude-code (CLI `claude -p` đã đăng nhập trên máy, KHÔNG cần API key) | codex | fake
provider: fake

# model theo tier trong front matter agent (10 agent của keeper: `light` cho quality/release, `standard` cho
# triager/patcher, `strong` chưa dùng). Thiếu `light` thì lùi về `standard` → `strong`.
models:
  strong: ""
  standard: ""
  light: ""

# Trần ký tự cho prompt GỬI ĐI (system + payload + blackboard); vượt thì runner cắt và gắn nhãn
# (`xagents_core.context`). Biến môi trường: KEEPER_MAX_INPUT_CHARS.
max_input_chars: 120000

max_tokens: 16000

# chỉ provider anthropic / CLI: mức nỗ lực theo tier (low | medium | high | xhigh | max)
effort:
  strong: high
  standard: medium
  light: low

# --- ADR-0006: nhiều gói tài khoản subscription thay vì API trả theo token ---
# Khai `backends:` thì `provider`/`models` ở trên KHÔNG dùng nữa. Thứ tự khai = thứ tự ưu tiên; hết quota thì
# backend nghỉ `cooldown_s` và lượt đó đi backend kế. `KEEPER_LLM_BACKENDS=a,b` lọc/sắp lại khi chạy.
#
