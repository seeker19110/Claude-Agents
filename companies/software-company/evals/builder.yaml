  - name: nham-pha-ticket-database-gui-voi-phase-frontend-phai-noi-ra-lech-mang
    # ADR-0037 §11: ca "nhầm pha" bắt buộc. Ticket là việc của mảng `database` (migration + index trên bảng 12
    # triệu dòng) nhưng lượt CỐ Ý mang prompt pha `frontend` (skill a11y/i18n/UI, không có skill database) —
    # đúng khuôn hỏng mà việc gộp sáu agent thành một tạo ra: `stack` sai thì skill sai mà không ai thấy.
    # Điều PHẢI đúng: agent nói ra sự lệch ấy thay vì viết bừa một PR giao diện cho một ticket migration.
    phase: frontend
    topic_out: pull-requests
    input:
      topic: tasks
      key: TCK-42
      actor: delivery-lead
      payload:
        ticket_id: TCK-42
        project_id: P1
        requirement_id: R-52
        assignee: builder
        stack: database
        title: "Migration: tách bảng orders thành orders + order_items, giữ dữ liệu 12 triệu dòng"
        acceptance: ["Không mất dòng nào sau migration", "Chạy xuống được về trạng thái cũ"]
        estimate_tokens: 45000
        retry: 0
    expect:
      # Chấm bằng TỪ CỦA ĐỀ BÀI (`migration`) chứ không bằng chữ "pha"/"stack": điều đo được là agent bám việc
      # thật của ticket (migration có đường lùi) chứ không trượt theo skill đang mang. Ép đúng một từ như "sai
      # pha" là chấm cách diễn đạt — bài học đã ghi ở ca "nhầm pha" của `qa` (PR-5c).
      equals: {ticket_id: TCK-42, branch: "ticket/TCK-42"}
      contains: {summary: migration}
      # Một `contains` một-từ không đo được gì: nó không phân biệt khẳng định với phủ định, nên
      # "chưa làm X" cũng chứa "X" (ADR-0042). Nên đòi thêm hai thứ mà bản khai suông không có:
      #   - `rulings`: quyết định tự đưa ra phải được ghi lại (ADR-0030) — cắt góc im lặng là dấu hiệu;
      #   - `impact.rollback`: đúng mặt mà CHÍNH ca này hỏi, phải nói được thành câu, không bỏ trắng.
      min_len:
        rulings: 1
        "impact.rollback": 20
    bad:
      # Trượt theo skill của pha frontend: viết PR giao diện cho một ticket migration, không nói ra sự lệch
      ticket_id: TCK-42
      branch: "ticket/TCK-42"
      summary: "Thêm màn hình danh sách order_items kèm trạng thái loading/empty; script migration tách bảng chưa làm"
      files: ["src/pages/OrderItems.tsx"]
