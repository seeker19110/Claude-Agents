  - name: man-hinh-moi-phai-du-4-trang-thai-va-i18n
    phase: frontend
    topic_out: pull-requests
    context:
      - {actor: product, namespace: api-contract, content_ref: openapi.yaml, summary: "GET /orders trả cursor + mảng orders"}
    input:
      topic: tasks
      key: TCK-20
      actor: delivery-lead
      payload:
        ticket_id: TCK-20
        project_id: P1
        requirement_id: R-30
        assignee: builder
        stack: frontend
        title: "Màn hình danh sách đơn hàng"
        acceptance: ["Người dùng xem được đơn hàng của mình", "Danh sách rỗng có hướng dẫn tiếp theo"]
        estimate_tokens: 50000
        retry: 0
    expect:
      equals: {ticket_id: TCK-20, branch: "ticket/TCK-20"}
      # WCAG 2.2 AA cho mọi màn hình 4 trạng thái, 0 chuỗi hard-code — cả hai đều là cổng, không phải việc làm thêm.
      # `contains: {summary: i18n}` một mình KHÔNG đo được điều đó: nó không phân biệt khẳng định với phủ định
      # (ADR-0042), nên "chưa làm i18n" cũng qua. Hai đường ra hợp lệ, không có đường thứ ba:
      #   (A) làm thật — nhắc i18n, có file, và `local_checks` do CODE xác nhận (`verified_by`, ADR-0038);
      #   (B) không làm được — nói thẳng bằng `no_changes_reason`, không mô tả một PR không tồn tại.
      # Bản `bad:` dưới đây khai đã làm mà không có cả hai ⇒ bị bác.
      contains: {summary: i18n}
      any_of:
        - - min_len: {files: 1}
            equals: {local_checks.verified_by: workspace}
          - min_len: {no_changes_reason: 40}
    bad:
      # `contains` không phân biệt khẳng định với phủ định: PR này HARD-CODE hết chuỗi rồi nói "chưa làm i18n"
      ticket_id: TCK-20
      branch: "ticket/TCK-20"
      summary: "Thêm màn hình danh sách đơn hàng, chuỗi tiếng Việt viết thẳng trong JSX; chưa làm i18n và mới có trạng thái success"
      files: ["src/pages/Orders.tsx"]

