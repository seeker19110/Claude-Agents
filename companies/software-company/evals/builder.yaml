# Eval cho builder (ADR-0037 PR-5d: gộp backend + frontend + mobile + database + platform + data theo pha).
# Chạy: python -m company.evals builder
#
# Pha của lượt = `stack` của ticket (ADR-0013), nên mỗi ca dưới đây khai `phase:` trùng `payload.stack`. Đó là
# khác biệt duy nhất so với sáu file cũ: `assignee` nay chỉ còn một giá trị (`builder`) và không còn nói ticket
# thuộc mảng nào — `stack` nói.
cases:
  - name: endpoint-ghi-phai-co-idempotency-va-test-truoc
    phase: backend
    topic_out: pull-requests
    context:
      - {actor: product, namespace: api-contract, content_ref: openapi.yaml, summary: "POST /payments chưa có trong contract v1"}
      - {actor: product, namespace: architecture, content_ref: c4-l2.md, summary: "payment-service gọi cổng thanh toán qua outbox"}
    input:
      topic: tasks
      key: TCK-10
      actor: delivery-lead
      payload:
        ticket_id: TCK-10
        project_id: P1
        requirement_id: R-12
        assignee: builder
        stack: backend
        title: "POST /payments: tạo giao dịch thanh toán"
        acceptance: ["Gửi trùng cùng một yêu cầu không tạo hai giao dịch", "Cổng thanh toán timeout thì trả lỗi rõ, không treo"]
        risk_tags: [payment]
        estimate_tokens: 60000
        budget_tokens: 90000
        retry: 0
    expect:
      # "idempotency key cho endpoint ghi" và "mọi lời gọi ra ngoài có timeout" là bắt buộc, không phải tuỳ chọn
      # `local_checks.tests` không nằm trong tiêu chí: lượt eval không chạy được test thật, đòi true là thưởng cho
      # model nào dám khai man. Cái chấm được là PR có nói tới idempotency và timeout hay không.
      equals: {ticket_id: TCK-10, branch: "ticket/TCK-10"}
      contains: {summary: idempotency}
      # Một `contains` một-từ không đo được gì: nó không phân biệt khẳng định với phủ định, nên
      # "chưa làm X" cũng chứa "X" (ADR-0042). Nên đòi thêm hai thứ mà bản khai suông không có:
      #   - `rulings`: quyết định tự đưa ra phải được ghi lại (ADR-0030) — cắt góc im lặng là dấu hiệu;
      #   - `impact.rollback`: đúng mặt mà CHÍNH ca này hỏi, phải nói được thành câu, không bỏ trắng.
      min_len:
        rulings: 1
        "impact.rollback": 20
    bad:
      # PR khai thẳng là CHƯA có idempotency key lẫn timeout — chữ "idempotency" vẫn có mặt
      ticket_id: TCK-10
      branch: "ticket/TCK-10"
      summary: "Thêm POST /payments gọi thẳng cổng thanh toán, chưa có idempotency key và chưa đặt timeout cho lời gọi ra ngoài"
      files: ["src/payments/api.py"]

