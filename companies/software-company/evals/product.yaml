# Eval cho product (ADR-0037 PR-5e: gộp intake + clarifier + researcher + synthesizer + risk + spec-writer +
# delivery-lead thành bốn pha `intake`/`research`/`spec`/`plan`). Chạy: python -m company.evals product
#
# Mỗi ca khai `phase:` — `evals.py` bắt buộc điều đó với agent có `phases`, và pha phải có trong front matter.
# Hai ca của `risk` cũ không còn là lượt riêng: rủi ro nay là mục `risks` NGAY trong `requirements-draft` của pha
# `spec`, nên chúng trở thành `expect.min_len: {risks: ...}` trên draft (§11). Actor của event đầu vào là
# `product` ở những chỗ trước là intake/researcher/synthesizer/risk — cả chuỗi nghiên cứu nay là một agent.
cases:
  # ---------- pha intake (intake.md + clarifier.md) ----------
  - name: de-bai-tho-phai-ra-goal-rang-buoc-va-cau-hoi-cho-tung-agent
    phase: intake
    topic_out: research-findings
    input:
      topic: research-requests
      key: P1
      actor: human
      payload:
        project_id: P1
        description: "Phòng khám tư 3 chi nhánh muốn cổng đặt lịch khám online. Bệnh nhân tự đặt, lễ tân xác nhận, nhắc lịch qua Zalo. Phải tuân Nghị định 13/2023 về dữ liệu cá nhân. Ngân sách 3 tháng. Hệ thống HIS hiện có chỉ xuất được CSV."
        attachments: ["docs/quy-trinh-le-tan.pdf"]
    expect:
      # mọi ràng buộc trong đầu vào phải xuất hiện trong constraints — bỏ sót một ràng buộc là bỏ sót một rủi ro
      equals: {project_id: P1, kind: intake}
      min_len: {data.constraints: 3, data.questions: 2}
      contains: {data.constraints: "13/2023"}

  - name: change-request-da-duyet-phai-truy-ve-change-id
    phase: intake
    topic_out: research-findings
    input:
      topic: change-requests
      key: CHG-1
      actor: ops
      payload:
        change_id: CHG-1
        project_id: P1
        requested_by: "chủ phòng khám"
        description: "Bổ sung thanh toán trước khi đặt lịch, qua ví điện tử, để giảm tỉ lệ không đến khám"
        affects_requirements: [R-1, R-3]
        decision: accepted
    expect:
      # tên ca là "truy về change_id": biên bản phải chỉ được ngược về yêu cầu thay đổi, không chỉ mô tả lại nội dung
      equals: {project_id: P1, kind: intake, data.change_id: CHG-1}
      contains: {data.goals.0.text: "thanh toán"}
      min_len: {data.questions: 2, data.constraints: 1}

  - name: yeu-cau-mo-ho-phai-thanh-cau-hoi-co-lua-chon-va-mac-dinh
    phase: intake
    topic_out: clarification-questions
    input:
      topic: requirements-draft
      key: P1
      actor: product
      payload:
        project_id: P1
        kind: draft
        requirements:
          - {id: R-1, type: FR, text: "Hệ thống gửi nhắc lịch khám cho bệnh nhân", source: "họp kickoff 2026-09-01", priority: must}
          - {id: R-2, type: NFR, text: "Hệ thống phải nhanh", source: "email khách 2026-08-30", priority: must}
          - {id: R-3, type: FR, text: "Lễ tân xem được lịch của các chi nhánh", source: "họp kickoff 2026-09-01", priority: should}
        risks: [{id: RISK-1, req_id: R-1, category: privacy, severity: medium, mitigation: "chỉ gửi mã lịch hẹn, không gửi chẩn đoán", owner: product}]
        conflicts: ["chưa rõ nhắc qua Zalo hay SMS", "chưa rõ 'nhanh' là bao nhiêu giây"]
    expect:
      # mỗi câu hỏi kèm 2–4 lựa chọn và một mặc định: người trả lời bận, không trả lời cũng phải đi tiếp được
      equals: {project_id: P1, round: 1}
      min_len: {questions: 2, questions.0.options: 2, questions.0.default: 1}
      max_len: {questions: 10, questions.0.options: 4}

  - name: draft-ro-rang-thi-hoi-it-khong-hoi-lay-le
    phase: intake
    topic_out: clarification-questions
    input:
      topic: requirements-draft
      key: P2
      actor: product
      payload:
        project_id: P2
        kind: draft
        requirements:
          - {id: R-1, type: FR, text: "Người dùng xuất danh sách đơn hàng ra CSV, mã hoá UTF-8, tối đa 10.000 dòng mỗi lần", source: "đặc tả khách gửi 2026-08-28", priority: must}
          - {id: R-2, type: NFR, text: "Xuất 10.000 dòng xong trong 5 giây trên máy 2 vCPU", source: "đặc tả khách gửi 2026-08-28", priority: must, quality_char: "hiệu năng", measure: "p95 ≤ 5s"}
        risks: []
        conflicts: []
    expect:
      equals: {project_id: P2, round: 1}
      max_len: {questions: 3}

  # ---------- pha research (researcher.md) ----------
  - name: de-bai-day-du-phai-ra-4-muc-co-nguon
    phase: research
    topic_out: research-findings
    input:
      topic: research-findings
      key: P1
      actor: product
      payload:
        project_id: P1
        kind: intake
        data:
          goal: "Cổng đặt lịch khám cho phòng khám tư 3 chi nhánh, bệnh nhân đặt lịch online, lễ tân xác nhận, nhắc lịch qua Zalo"
          users: ["bệnh nhân", "lễ tân", "bác sĩ"]
          constraints: ["Nghị định 13/2023 về dữ liệu cá nhân", "ngân sách 3 tháng", "hệ thống HIS hiện có xuất CSV"]
          attachments: ["docs/quy-trinh-le-tan.pdf", "repo: github.com/clinic/his-export"]
        sources: ["email khách 2026-08-30", "họp kickoff 2026-09-01"]
    expect:
      equals: {project_id: P1, kind: researcher}
      min_len: {data.ux.flows: 1, data.ux.personas: 2, data.tech.options: 1, sources: 1}
      contains: {data.domain.regulations: "13/2023"}
      # Glossary phải TỚI ĐƯỢC synthesizer, không phải phải nằm ở một chỗ nhất định: synthesizer có
      # `context_namespace_read: [glossary, ...]` nên nó đọc toàn văn namespace `glossary` (ADR-0020).
      # Viết thẳng vào báo cáo hay ghi artifact rồi trỏ tới đều đủ — với đề bài đầy đủ, artifact glossary
      # lên tới 6KB, lặp lại inline chỉ tốn token đầu ra chứ không thêm thông tin cho ai.
      any_of:
        - - min_len: {data.domain.glossary: 3}
          - min_len: {data.domain.glossary_ref: 1}

  - name: khong-co-codebase-phai-ghi-khong-ap-dung-khong-bia
    phase: research
    topic_out: research-findings
    input:
      topic: research-findings
      key: P2
      actor: product
      payload:
        project_id: P2
        kind: intake
        data:
          goal: "Ứng dụng mobile ghi chú giọng nói cho tài xế, tóm tắt bằng AI, sản phẩm mới hoàn toàn"
          users: ["tài xế xe tải"]
          constraints: ["offline-first", "chi phí LLM ≤ 0.01 USD/ghi chú"]
        sources: ["brief khách"]
    expect:
      equals: {project_id: P2, kind: researcher}
      contains: {data.codebase: "không áp dụng"}
      min_len: {data.tech.ai_risks: 1, data.tech.options: 1}

  # ---------- pha spec (synthesizer.md + spec-writer.md + risk.md) ----------
  - name: du-bao-cao-phai-ra-yeu-cau-co-source-va-nfr-do-duoc
    phase: spec
    topic_out: requirements-draft
    input:
      topic: research-findings
      key: P1
      actor: product
      payload:
        project_id: P1
        kind: researcher
        sources: ["họp kickoff 2026-09-01", "docs/quy-trinh-le-tan.pdf"]
        # đề bài của intake, orchestrator đính kèm qua `_with_intake` (ADR-0006: tiêu chí bắt đầu cần cả hai báo cáo)
        intake:
          goals:
            - {id: G-1, text: "Bệnh nhân tự đặt lịch khám online, không phải gọi điện"}
            - {id: G-2, text: "Lễ tân xác nhận hoặc từ chối yêu cầu đặt lịch trong ngày"}
            - {id: G-3, text: "Hệ thống nhắc lịch khám qua Zalo trước giờ hẹn"}
          constraints:
            - {id: C-1, text: "Tuân Nghị định 13/2023 về bảo vệ dữ liệu cá nhân", source: "họp kickoff 2026-09-01"}
            - {id: C-2, text: "Ngân sách 3 tháng cho bản đầu", source: "họp kickoff 2026-09-01"}
            - {id: C-3, text: "HIS hiện có chỉ xuất được CSV", source: "docs/quy-trinh-le-tan.pdf"}
          assumptions:
            - {id: A-1, text: "Bệnh nhân đã dùng Zalo", needs_confirmation: true}
        data:
          domain:
            glossary: ["lịch hẹn", "ca khám", "bệnh nhân"]
            regulations: ["Nghị định 13/2023"]
          ux:
            personas: ["bệnh nhân", "lễ tân"]
            flows: ["đặt lịch → xác nhận → nhắc lịch"]
          codebase: "không áp dụng — sản phẩm mới"
          tech:
            options: ["web app + Zalo OA API"]
            ai_risks: []
    expect:
      # 100% requirement có source; NFR có số đo — "phải nhanh" không phải một yêu cầu
      equals: {project_id: P1, kind: draft}
      min_len: {requirements: 3, requirements.0.source: 3}

  - name: thieu-muc-nghien-cuu-phai-tra-rong-khong-duoc-bia
    phase: spec
    topic_out: requirements-draft
    input:
      topic: research-findings
      key: P2
      actor: product
      payload:
        project_id: P2
        kind: researcher
        sources: ["brief khách"]
        data:
          domain:
            glossary: ["ghi chú", "chuyến đi"]
          tech:
            options: ["ứng dụng Android"]
    expect:
      # tiêu chí bắt đầu không đủ (thiếu ux và codebase): nêu ra, không tự bịa yêu cầu
      equals: {project_id: P2, kind: draft}
      max_len: {requirements: 0}
      min_len: {conflicts: 1}

  - name: luong-thanh-toan-phai-ra-rui-ro-co-mitigation-va-owner
    phase: spec
    topic_out: requirements-draft
    input:
      topic: research-findings
      key: P1
      actor: product
      payload:
        project_id: P1
        kind: researcher
        sources: ["CHG-1", "họp kickoff 2026-09-01"]
        data:
          domain: {glossary: ["ví điện tử", "phí khám", "căn cước"], regulations: ["Nghị định 13/2023"]}
          ux: {personas: ["bệnh nhân", "lễ tân"], flows: ["chọn giờ → thanh toán → xác nhận"]}
          codebase: "không áp dụng — sản phẩm mới"
          tech: {options: ["cổng ví điện tử trong nước"], ai_risks: []}
        yeu_cau_da_biet:   # đề bài của pha `intake`, orchestrator đính kèm qua `_with_intake`
          - {id: R-1, type: FR, text: "Bệnh nhân thanh toán trước phí khám qua ví điện tử", source: "CHG-1", priority: must}
          - {id: R-2, type: FR, text: "Lưu số căn cước và tiền sử bệnh của bệnh nhân", source: "họp kickoff 2026-09-01", priority: must}
          - {id: R-3, type: NFR, text: "Hệ thống sẵn sàng 99.5% trong giờ hành chính", source: "email khách 2026-08-30", priority: should, measure: "uptime ≥ 99.5%"}
        conflicts: []
    expect:
      # §11: ca của `risk` cũ nay chấm trên chính bản draft của pha `spec` — rủi ro không còn một lượt riêng.
      # Mọi rủi ro High phải có mitigation và owner; rủi ro không ai sở hữu là rủi ro không ai xử lý.
      equals: {project_id: P1, kind: draft}
      min_len: {risks: 2, risks.0.mitigation: 3, risks.0.owner: 2}

  - name: yeu-cau-rui-ro-cao-khong-co-bien-phap-phai-de-xuat-cat-hoac-hoan
    phase: spec
    topic_out: requirements-draft
    input:
      topic: research-findings
      key: P2
      actor: product
      payload:
        project_id: P2
        kind: researcher
        sources: ["ý tưởng của khách", "họp kickoff 2026-09-01"]
        data:
          domain: {glossary: ["chẩn đoán sơ bộ", "đơn thuốc"], regulations: ["Luật Khám bệnh, chữa bệnh"]}
          ux: {personas: ["bệnh nhân"], flows: ["mô tả triệu chứng → gợi ý → đặt lịch"]}
          codebase: "không áp dụng — sản phẩm mới"
          tech: {options: ["LLM qua API"], ai_risks: ["gợi ý sai thuốc", "PII trong prompt"]}
        yeu_cau_da_biet:   # đề bài của pha `intake`, orchestrator đính kèm qua `_with_intake`
          - {id: R-1, type: FR, text: "Tự động chẩn đoán sơ bộ bằng LLM và gợi ý đơn thuốc cho bệnh nhân, không cần bác sĩ duyệt", source: "ý tưởng của khách", priority: must}
          - {id: R-2, type: FR, text: "Đặt lịch khám online", source: "họp kickoff 2026-09-01", priority: must}
    expect:
      equals: {project_id: P2, kind: draft}
      min_len: {risks: 1, conflicts: 1}

  - name: draft-day-du-phai-ra-spec-cho-nguoi-duyet-khong-tu-duyet
    phase: spec
    topic_out: approved-specs
    input:
      topic: requirements-draft
      key: P1
      actor: product
      payload:
        project_id: P1
        kind: draft
        requirements:
          - {id: R-1, type: FR, text: "Bệnh nhân đặt lịch khám online và nhận xác nhận", source: "họp kickoff 2026-09-01", priority: must}
          - {id: R-2, type: FR, text: "Lễ tân xác nhận hoặc đổi lịch", source: "docs/quy-trinh-le-tan.pdf", priority: must}
          - {id: R-3, type: NFR, text: "Trang đặt lịch tải xong dưới 2.5 giây trên 4G", source: "email khách 2026-08-30", priority: should, measure: "LCP ≤ 2.5s"}
        risks: [{id: RISK-1, req_id: R-1, text: "dữ liệu sức khoẻ thuộc phạm vi Nghị định 13/2023", mitigation: "mã hoá at-rest, retention 24 tháng", owner: security}]
        conflicts: []
    expect:
      # trạng thái luôn là pending_human: agent không tự ký duyệt spec của chính mình
      equals: {project_id: P1, status: pending_human}
      min_len: {artifacts.prd: 3, artifacts.requirements: 3}

  - name: draft-con-mau-thuan-van-khong-duoc-tu-duyet
    phase: spec
    topic_out: approved-specs
    input:
      topic: requirements-draft
      key: P2
      actor: product
      payload:
        project_id: P2
        kind: draft
        requirements:
          - {id: R-1, type: FR, text: "Bệnh nhân huỷ lịch bất cứ lúc nào, hoàn tiền đầy đủ", source: "khách nói 2026-08-30", priority: must}
          - {id: R-2, type: constraint, text: "Không hoàn tiền cho lịch huỷ trong vòng 24 giờ trước giờ khám", source: "quy định phòng khám", priority: must}
        risks: [{id: RISK-1, req_id: R-1, category: business, severity: medium, mitigation: "chốt chính sách hoàn tiền với khách trước khi code", owner: product}]
        conflicts: ["R-1 và R-2 mâu thuẫn về chính sách hoàn tiền"]
    expect:
      equals: {project_id: P2}
      one_of: {status: [pending_human]}

  - name: ung-dung-phai-khai-kind-va-runtime-de-gate-1-hoi-chay-o-dau
    phase: spec
    # ADR-0031: spec kind=application thiếu runtime thì orchestrator không mở gate spec mà trả lại spec-writer
    topic_out: approved-specs
    input:
      topic: requirements-draft
      key: P3
      actor: product
      payload:
        project_id: P3
        kind: draft
        requirements:
          - {id: R-1, type: FR, text: "Nhân viên kho quét mã vạch nhập/xuất hàng qua web app trên máy tính bảng", source: "khảo sát kho 2026-09-02", priority: must}
          - {id: R-2, type: FR, text: "Báo cáo tồn kho theo ngày, xuất CSV", source: "email kế toán 2026-09-03", priority: must}
          - {id: R-3, type: constraint, text: "Chạy on-premise, Python, không dịch vụ cloud", source: "IT khách", priority: must}
        risks: []
        conflicts: []
    expect:
      equals: {project_id: P3, status: pending_human, kind: application}
      min_len: {runtime.command: 3, runtime.health: 1, artifacts.prd: 3}

  # ---------- pha plan (delivery-lead.md) ----------
  - name: spec-duyet-phai-ra-ticket-truy-vet-duoc-va-co-uoc-luong
    phase: plan
    topic_out: tasks
    context:
      - {actor: product, namespace: prd, content_ref: PRD.md, summary: "R-12 (Must): khách thanh toán đơn hàng bằng thẻ; R-20 (Should): xem lịch sử đơn"}
      - {actor: security, namespace: threat-model, content_ref: threat-model.md, summary: "luồng thanh toán: STRIDE xong, threat model v1"}
    input:
      topic: approved-specs
      key: P1
      actor: human
      payload:
        project_id: P1
        status: approved
        reviewer: "chủ đầu tư"
        artifacts: {prd: docs/PRD.md, requirements: docs/requirements.json, risks: docs/risk-register.json}
    expect:
      # ticket không truy được về requirement_id là ticket không ai biết vì sao phải làm
      equals: {project_id: P1, retry: 0}
      min_len: {acceptance: 1, requirement_id: 3}
      one_of: {stack: [backend, frontend, mobile, database, platform, data]}

  - name: su-co-code-phai-thanh-ticket-uu-tien-cao
    phase: plan
    topic_out: tasks
    input:
      topic: incidents
      key: INC-1
      actor: ops
      payload:
        incident_id: INC-1
        project_id: P1
        severity: SEV1
        summary: "Thanh toán trừ tiền hai lần khi khách bấm nút lúc mạng chậm; 14 khách bị ảnh hưởng"
        ticket_id: TCK-10
        root_cause_class: code
    expect:
      equals: {project_id: P1, retry: 0}
      one_of: {priority: [1, 2], stack: [backend, frontend, mobile, database, platform, data]}
      min_len: {acceptance: 1}

  # ---------- ca "nhầm pha" bắt buộc (§11) ----------
  - name: nham-pha-de-bai-tho-gui-voi-phase-plan-phai-noi-ra-chua-co-gi-de-chia-ticket
    # ADR-0037 §11: input của pha `intake` (một mô tả tự do, chưa có spec, chưa có yêu cầu nào) nhưng lượt CỐ Ý
    # mang prompt pha `plan` — đúng khuôn hỏng mà việc gộp bảy agent thành một tạo ra: prompt loãng thì agent
    # chia ticket từ một đoạn văn chưa ai duyệt. Điều PHẢI đúng: agent bám việc thật của đầu vào (bóc đề bài
    # thành mục tiêu/ràng buộc/câu hỏi) thay vì trượt theo bộ skill đang mang.
    # Chấm bằng TỪ CỦA ĐỀ BÀI ("kho") chứ không bằng chữ "pha"/"sai pha": ép một cách diễn đạt là chấm văn phong,
    # không chấm hành vi — bài học ca "nhầm pha" của `qa` (PR-5c) và `builder` (PR-5d).
    phase: plan
    topic_out: research-findings
    input:
      topic: research-requests
      key: P9
      actor: human
      payload:
        project_id: P9
        description: "Kho vật tư của một nhà máy đang ghi sổ trên giấy. Muốn quét mã vạch nhập/xuất, biết tồn kho theo ca, và cảnh báo khi dưới định mức. Chưa có hệ thống nào, chưa có ngân sách chốt."
    expect:
      equals: {project_id: P9, kind: intake}
      contains: {data.goals.0.text: "kho"}
      min_len: {data.questions: 2}
