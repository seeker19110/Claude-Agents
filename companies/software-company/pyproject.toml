[project]
name = "software-company"
version = "0.5.0"
description = "Multi-agent công ty gia công phần mềm, event-driven (7 khối, 21 agent)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.6",
    "pyyaml>=6",
    "xagents-core",   # lõi chung (ADR gốc 0001); mã chuyển sang theo bảy bước K3.1-K3.7
]

[tool.uv.sources]
xagents-core = { workspace = true }

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]   # provider anthropic; provider openai-compatible không cần SDK
graph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Cảnh báo là lỗi: DeprecationWarning của thư viện hay ResourceWarning socket/file phải hiện ra trong CI,
# không trôi qua trong 80 dòng log. Ngoại lệ duy nhất: runpy cảnh báo khi chạy lại một module đã import —
# đúng thứ ba test `*_main.py` cố ý làm để phủ nhánh `if __name__ == "__main__"`.
filterwarnings = [
    "error",
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/company"]
omit = ["src/company/graph.py"]   # cần langgraph, không cài trong CI
# ThreadingTCPServer trong mcp_bridge chạy handler ở thread riêng; không khai concurrency=thread thì
# coverage đôi khi bỏ sót các dòng chạy trong thread đó, gây flaky giữa các lần đo (thấy rõ khi chạy
# cùng toàn bộ test suite thay vì riêng test_mcp_bridge.py).
concurrency = ["thread"]
# Phủ NHÁNH, không chỉ dòng — cùng lý do đã ghi ở keeper/pyproject.toml: `fail_under = 100` trên dòng vẫn để
# lọt nhánh chưa đi (một if/else mà chỉ một vế từng chạy vẫn tính 100% dòng). Đo 2026-09-10: 86 nhánh chưa đi
# trên toàn package; PR #258 bù xong 24/86 (8 file: assetscan, delivery, evals, gate_brief, llm, mcp_bridge,
# metrics, orch/cli_cmds). Đo lại 2026-09-12: CÒN 67 nhánh / 16 file. Phiên 2026-09-13: bù xong gate_cli.py
# (5/67, xác nhận `uv run pytest -q tests/test_gate_risk.py --cov=company.gate_cli --cov-branch` 0 missing) —
# CÒN 62 nhánh / 15 file (orch/{gates_flow,rehydrate,release_fsm,routes,scheduler,ticket_fsm,verify,
# worktree_flow}, orchestrator, probe, runner, subagents, supervisor, tools, web, workspace —
# `uv run pytest -q --cov --cov-report=term-missing` với `branch = true` tạm bật cho danh sách chính xác).
# KHÔNG ghi "bật ở PR kế tiếp" nữa — dòng đó đã trôi qua nhiều PR không ai làm (bài học `TRAPS.md` §6: TODO
# không hạn đáo là dẫn chiếu chết). Việc bù 62 nhánh còn lại nằm trong `docs/TASK-PACK.md` "Việc để lại đang treo".
# branch = true   # bật khi bù xong 62 nhánh trên — xem sổ treo ở docs/TASK-PACK.md, không phải "PR kế tiếp"

[tool.coverage.report]
# Cả năm package phủ 100%: ngưỡng bằng đúng mức đạt được, nên mất một dòng/nhánh phủ là CI đỏ.
# Nhánh phụ thuộc nền tảng (os.name == "nt", AF_INET6) được test bằng cách thay socket/ctypes, không bằng môi trường.
fail_under = 100
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# `warn_unused_ignores` CỐ Ý không bật ở hai package này (gateway có, và giữ nguyên). Đo được
# 2026-09-07: nó báo 6 `# type: ignore` "thừa" mà phần lớn là PHỤ THUỘC NỀN — `ctypes.windll`
# (`sqlite_bus.py:119`) thừa trên Windows nhưng CẦN trên Linux. CI chạy cả ubuntu lẫn windows, nên bật
# nó là dựng một cổng đúng-sai theo máy chạy: xanh ở đây, đỏ ở kia, không ai sửa được cho cả hai.
# Đó đúng là khuôn "test đúng-sai theo nền tảng" đã ghi ở TRAPS.md §2.

# K6.2: `orch/*` là mã VIẾT MỚI ở K1 — nó không mang nợ kiểu của bản 2269 dòng, nên siết được ngay mà không
# phải sửa lại lịch sử. Siết theo MODULE thay vì bật `strict = true` cho cả package: bật toàn bộ là một PR
# khổng lồ chạm mọi file, và nó sẽ bị hạ ngưỡng ở lần đầu tiên vướng — đúng khuôn đã ghi ở TRAPS §2.
# Module mới thêm vào `orch/` tự động nằm trong phạm vi này; đó là điểm của việc khoá theo tiền tố.
[[tool.mypy.overrides]]
module = "company.orch.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: code gốc cố ý viết gọn nhiều lệnh một dòng. RUF001-003: ký tự Unicode tiếng Việt (→ ≥ ×) trong comment/docstring.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]
