# Cài: `uv tool install pre-commit && pre-commit install` (xem CONTRIBUTING.md §2).
# Hook chạy trên file được stage; CI chạy lại cùng bộ ruff/gitleaks nên đây chỉ là vòng phản hồi sớm.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Chỉ ruff-check, không ruff-format: các package cố ý giữ nhiều lệnh một dòng (ignore E701/E702),
  # ruff format sẽ viết lại hàng chục file. Mỗi file lấy cấu hình từ pyproject.toml của package chứa nó.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6   # cùng bản ruff với uv.lock ở gốc workspace
    hooks:
      - id: ruff-check

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks   # dùng .gitleaks.toml ở gốc repo, cùng cấu hình với job `audit`

  # Bản dẫn xuất trong .claude/agents/ phải khớp agents/. Sửa prompt nguồn mà quên `make subagents` thì
  # người duyệt gate chấm theo tiêu chuẩn cũ — CI cũng chặn, đây chỉ là vòng phản hồi sớm.
  - repo: local
    hooks:
      - id: subagents-check
        name: subagent dẫn xuất khớp nguồn
        entry: uv run --project software-company python -m company.subagents check
        language: system
        pass_filenames: false
        files: ^(software-company/(agents|skills)/|software-company/gates/checklists\.md|\.claude/agents/sc-)
