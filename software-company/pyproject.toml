[project]
name = "software-company"
version = "0.5.0"
description = "Multi-agent công ty gia công phần mềm, event-driven (7 khối, 20 agent)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]   # provider anthropic; provider openai-compatible không cần SDK
graph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/company"]
omit = ["src/company/graph.py"]   # cần langgraph, không cài trong CI
# ThreadingTCPServer trong mcp_bridge chạy handler ở thread riêng; không khai concurrency=thread thì
# coverage đôi khi bỏ sót các dòng chạy trong thread đó, gây flaky giữa các lần đo (thấy rõ khi chạy
# cùng toàn bộ test suite thay vì riêng test_mcp_bridge.py).
concurrency = ["thread"]

[tool.coverage.report]
# Ngưỡng đặt ở mức đang đạt được: nó chặn tụt lùi, không phải mục tiêu để phấn đấu tới.
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: code gốc cố ý viết gọn nhiều lệnh một dòng. RUF001-003: ký tự Unicode tiếng Việt (→ ≥ ×) trong comment/docstring.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]
