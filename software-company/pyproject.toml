[project]
name = "software-company"
version = "0.2.0"
description = "Multi-agent công ty gia công phần mềm, event-driven (7 khối, 22 agent)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
graph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: code gốc cố ý viết gọn nhiều lệnh một dòng. RUF001-003: ký tự Unicode tiếng Việt (→ ≥ ×) trong comment/docstring.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]
