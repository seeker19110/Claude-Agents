name: One-time quality durability transfer
on:
  push:
    branches: [chore/quality-durability-transfer]
    paths: [.github/workflows/quality-durability-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'seeker19110/Claude-Agents' && github.ref == 'refs/heads/chore/quality-durability-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply only the checksum-pinned source patch
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          import zlib
          encoded = ''.join(Path(f'.transfer/part{i}').read_text(encoding='utf-8').strip() for i in range(4))
          assert len(encoded) == 22392
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 58065
          assert hashlib.sha256(patch).hexdigest() == '93df76aca284e657133fa8e9c3425bd5505b62626083ea4e2d15c83e18d51af4'
          Path('/tmp/quality-hardening.patch').write_bytes(patch)
          PY
          git apply --check /tmp/quality-hardening.patch
          git apply --index /tmp/quality-hardening.patch
          git rm -- .transfer/part0 .transfer/part1 .transfer/part2 .transfer/part3 .github/workflows/quality-durability-transfer.yml
          git diff --cached --check
          test "$(git write-tree)" = 'e4974aa54a040cd02286eee9a7838f2cc915b2ff'
          git -c user.name=seeker19110 -c user.email=29851712+seeker19110@users.noreply.github.com commit -m 'feat: assemble verified durable quality result changes'
          git push origin HEAD:refs/heads/chore/quality-durability-transfer
          git rev-parse HEAD HEAD^{tree}
