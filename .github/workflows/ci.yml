name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run ruff check src tests
        working-directory: companies/software-company
      - run: uv run mypy src/company --ignore-missing-imports
        working-directory: companies/software-company

  unit:
    name: unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # cận dưới của requires-python và bản mới nhất đang dùng
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          # Code có nhánh riêng cho Windows (bảng mã CLI, SystemRoot của cầu MCP, creationflags, _alive)
          # mà trước đây không CI nào chạy: một job Windows đủ để chúng không mục đi.
          # Chân Windows đã xanh liên tiếp kể từ khi thêm, nên đã bỏ `continue-on-error`: từ đây nó CHẶN merge.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      # --durations: test git/worktree chậm dần thì thấy ngay trong log, không phải đoán.
      # -n auto (pytest-xdist): test git/worktree nặng I/O, chạy tuần tự 346 s trên Windows; đo cục bộ
      # 4 worker còn 97 s, 730/730 xanh (2026-09-06). Runner GitHub 4 nhân nên auto = 4.
      - run: uv run pytest -q -n auto --cov --cov-report=term-missing --durations=10
        if: runner.os != 'Windows'
        working-directory: companies/software-company
      # Windows: chạy test, không đo coverage (nhánh riêng của POSIX không chạy ở đây nên ngưỡng sẽ lệch).
      - run: uv run pytest -q -n auto --durations=10
        if: runner.os == 'Windows'
        working-directory: companies/software-company

  eval-replay:
    name: eval-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # Eval từ bản ghi (ADR-0010): không gọi model. `--strict` đỏ khi agent có tên trong
      # evals/recordings/REQUIRED.txt mà thiếu bản ghi, hoặc bản ghi ghi ở phiên bản prompt cũ.
      - run: uv run python -m company.evals all --replay --strict
        working-directory: companies/software-company

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks quét cả lịch sử, không chỉ commit cuối
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Phụ thuộc có CVE đã biết (cả năm package, một uv.lock)
        shell: bash
        run: |
          set -euo pipefail
          # Workspace có MỘT uv.lock ở root: export một lần là đủ cả năm package. Bỏ dòng `-e`
          # (gói cục bộ trong repo, PyPI không có nên pip-audit đỏ); phụ thuộc bên thứ ba của
          # chúng vẫn nằm trong cùng bản export nên không mất phạm vi quét.
          uv export --no-hashes --no-dev --all-packages | sed '/^-e /d' > /tmp/req.txt
          uvx pip-audit --strict -r /tmp/req.txt
      - name: Bí mật lọt vào lịch sử git
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  keeper-eval-replay:
    name: keeper-eval-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # Eval từ bản ghi (KHÔNG gọi model, không chạm mạng). `--strict` đỏ khi agent có tên trong
      # evals/recordings/REQUIRED.txt mà thiếu bản ghi, hoặc bản ghi ghi ở phiên bản prompt cũ;
      # evals/thresholds.yaml đỏ thêm khi điểm chấm tụt dưới sàn đã đo.
      - run: uv run python -m keeper.evals all --replay --strict
        working-directory: companies/keeper

  # Golden trong repo phải khớp bản `make golden` sinh ra: chặn "sửa agent rồi quên commit lại golden".
  golden-check:
    name: golden-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: companies/software-company
          - dir: companies/keeper
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: UPDATE_GOLDEN=1 uv run pytest -q tests/test_golden_agents.py
        working-directory: ${{ matrix.dir }}
      - name: Golden đã commit có khớp không
        run: |
          if ! git diff --exit-code -- ${{ matrix.dir }}; then
            echo "::error::Golden lệch — chạy \`make golden\` trong ${{ matrix.dir }} rồi commit lại" >&2
            exit 1
          fi
      # Subagent kiểm duyệt là bản dẫn xuất MỘT CHIỀU từ agents/. Lệch nguồn nghĩa là người duyệt gate đang
      # chấm theo tiêu chuẩn khác tiêu chuẩn công ty thực sự dùng — chặn ở cùng chỗ với golden.
      - name: Subagent dẫn xuất có khớp nguồn không
        if: matrix.dir == 'companies/software-company'
        run: uv run python -m company.subagents check
        working-directory: ${{ matrix.dir }}

  gateway-static:
    name: gateway-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run ruff check src tests
        working-directory: platform/gateway
      - run: uv run mypy src/gateway --ignore-missing-imports
        working-directory: platform/gateway

  gateway-unit:
    name: gateway-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
        include:
          # Chân Windows. Ba package này KHÔNG có chân Windows nào cho tới 2026-09-09, trong khi K3.1–K3.7
          # vừa dồn toàn bộ cơ chế chung của hai công ty vào `xagents-core` — package rủi ro cao nhất lại có
          # phạm vi nền tảng hẹp nhất. Đo được hậu quả: `test_overdue_khong_truyen_now_thi_lay_bay_gio` đỏ
          # tái hiện được trên Windows (đồng hồ bước ~15,6 ms) mà CI không hề thấy, xem #203.
          # Khác `unit`: ba package này KHÔNG có nhánh chỉ-POSIX nào bỏ lại, nên chân Windows
          # đo `--cov` luôn — đã kiểm tại chỗ, cả ba đạt đúng 100% trên Windows.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      # `shell: bash` cho CẢ hai nền tảng: mặc định của `run:` trên windows-latest là `pwsh`, và bước này
      # từng đỏ ở đó với đúng thông điệp "414 passed ... coverage 100.00%" rồi `exit code 1` — pytest xanh,
      # tiến trình trả 1. Không tái hiện được tại chỗ (Windows 11, cùng Python 3.13.15, cùng lệnh, kể cả chạy
      # dưới pwsh với `$ErrorActionPreference='stop'` và ép `uv` cài lại): khác biệt nằm ở lớp bọc pwsh của
      # runner, không ở test. Ba bước này vốn viết theo POSIX và `bash` có sẵn trên cả ba ảnh runner, nên cho
      # chúng cùng một vỏ là bỏ hẳn một lớp ngữ nghĩa chỉ-Windows khỏi cổng chất lượng.
      - run: uv run pytest -q --cov --cov-report=term-missing
        shell: bash
        working-directory: platform/gateway

  # console (trực ban hợp nhất): chỉ stdlib, phụ thuộc hai công ty qua path dependency.
  console-static:
    name: console-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run ruff check src tests
        working-directory: platform/console
      - run: uv run mypy src/console --ignore-missing-imports
        working-directory: platform/console

  console-unit:
    name: console-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
        include:
          # Chân Windows. Ba package này KHÔNG có chân Windows nào cho tới 2026-09-09, trong khi K3.1–K3.7
          # vừa dồn toàn bộ cơ chế chung của hai công ty vào `xagents-core` — package rủi ro cao nhất lại có
          # phạm vi nền tảng hẹp nhất. Đo được hậu quả: `test_overdue_khong_truyen_now_thi_lay_bay_gio` đỏ
          # tái hiện được trên Windows (đồng hồ bước ~15,6 ms) mà CI không hề thấy, xem #203.
          # Khác `unit`: ba package này KHÔNG có nhánh chỉ-POSIX nào bỏ lại, nên chân Windows
          # đo `--cov` luôn — đã kiểm tại chỗ, cả ba đạt đúng 100% trên Windows.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      # `shell: bash` cho CẢ hai nền tảng: mặc định của `run:` trên windows-latest là `pwsh`, và bước này
      # từng đỏ ở đó với đúng thông điệp "414 passed ... coverage 100.00%" rồi `exit code 1` — pytest xanh,
      # tiến trình trả 1. Không tái hiện được tại chỗ (Windows 11, cùng Python 3.13.15, cùng lệnh, kể cả chạy
      # dưới pwsh với `$ErrorActionPreference='stop'` và ép `uv` cài lại): khác biệt nằm ở lớp bọc pwsh của
      # runner, không ở test. Ba bước này vốn viết theo POSIX và `bash` có sẵn trên cả ba ảnh runner, nên cho
      # chúng cùng một vỏ là bỏ hẳn một lớp ngữ nghĩa chỉ-Windows khỏi cổng chất lượng.
      - run: uv run pytest -q --cov --cov-report=term-missing
        shell: bash
        working-directory: platform/console

  # Lõi chung của mọi công ty (ADR gốc 0001). `strict = true` từ ngày đầu (K6.1): core là chỗ hai công ty
  # tin cậy, nó không được lỏng hơn nơi gọi nó.
  core-static:
    name: core-static
    # Hai nền tảng, không phải một: `_alive` của `sqlite_bus` có nhánh riêng cho Windows, và chú kiểu cho
    # nhánh ấy CẦN trên Linux lại THỪA trên Windows (`strict` coi "thừa" là lỗi). Chỉ chạy ubuntu thì repo
    # không bao giờ biết `mypy` của nửa còn lại đỏ — đúng thứ đã xảy ra tới 2026-09-09.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run ruff check src tests
        working-directory: platform/xagents-core
      # KHÔNG có --ignore-missing-imports như bốn package kia: `strict` mà bỏ qua import thiếu thì mất đúng
      # phần bảo đảm vừa bật.
      - run: uv run mypy src/xagents_core
        working-directory: platform/xagents-core

  core-unit:
    name: core-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
        include:
          # Chân Windows. Ba package này KHÔNG có chân Windows nào cho tới 2026-09-09, trong khi K3.1–K3.7
          # vừa dồn toàn bộ cơ chế chung của hai công ty vào `xagents-core` — package rủi ro cao nhất lại có
          # phạm vi nền tảng hẹp nhất. Đo được hậu quả: `test_overdue_khong_truyen_now_thi_lay_bay_gio` đỏ
          # tái hiện được trên Windows (đồng hồ bước ~15,6 ms) mà CI không hề thấy, xem #203.
          # Khác `unit`: ba package này KHÔNG có nhánh chỉ-POSIX nào bỏ lại, nên chân Windows
          # đo `--cov` luôn — đã kiểm tại chỗ, cả ba đạt đúng 100% trên Windows.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # `shell: bash` cho CẢ hai nền tảng: mặc định của `run:` trên windows-latest là `pwsh`, và bước này
      # từng đỏ ở đó với đúng thông điệp "414 passed ... coverage 100.00%" rồi `exit code 1` — pytest xanh,
      # tiến trình trả 1. Không tái hiện được tại chỗ (Windows 11, cùng Python 3.13.15, cùng lệnh, kể cả chạy
      # dưới pwsh với `$ErrorActionPreference='stop'` và ép `uv` cài lại): khác biệt nằm ở lớp bọc pwsh của
      # runner, không ở test. Ba bước này vốn viết theo POSIX và `bash` có sẵn trên cả ba ảnh runner, nên cho
      # chúng cùng một vỏ là bỏ hẳn một lớp ngữ nghĩa chỉ-Windows khỏi cổng chất lượng.
      - run: uv run pytest -q --cov --cov-report=term-missing
        shell: bash
        working-directory: platform/xagents-core

  keeper-static:
    name: keeper-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run ruff check src tests
        working-directory: companies/keeper
      # CÓ --ignore-missing-imports, KHÁC core-static: keeper không bật `strict`
      # như xagents-core — đừng "sửa cho giống core" mà bỏ cờ này, mypy sẽ đỏ vì import thiếu chú kiểu.
      - run: uv run mypy src/keeper --ignore-missing-imports
        working-directory: companies/keeper

  drift-check:
    name: drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` LÀ ĐIỀU KIỆN ĐÚNG SAI, không phải tinh chỉnh: phép (c) đọc `git log` tìm mọi commit
      # `(#n)` đã merge. Với depth mặc định (1) `git log` chỉ có một commit, không PR nào bị soi, và cổng này
      # sẽ XANH GIẢ — tệ hơn không có cổng, vì nó tạo cảm giác đã được canh.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # Thuần cục bộ (đọc .git + file trên đĩa), không gọi mạng, không cần token.
      - run: uv run python -m keeper.cli drift --repo .

  keeper-unit:
    name: keeper-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      # `shell: bash`: lý do y hệt core-unit ở trên (lớp bọc pwsh của runner Windows nuốt mã thoát).
      - run: uv run pytest -q --cov --cov-report=term-missing
        shell: bash
        working-directory: companies/keeper

  # Tài sản prompt của repo là chuỗi cung ứng (ADR-0022): injection, ký tự ẩn, lệnh nguy hiểm, khóa lộ
  # trong `agents/ skills/ templates/ gates/ topics/` của CẢ HAI công ty (Studio-creators tách repo riêng ở
  # #259). Miễn trừ: assetscan-waivers.txt.
  asset-scan:
    name: asset-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked   # workspace: một .venv ở root cho cả năm package
      - run: uv run python -m company.assetscan scan . ../../companies/keeper
        working-directory: companies/software-company
      # Prompt tĩnh không được ăn quá nửa ngân sách token của chính agent đó, và skill khai phải tồn tại.
      - run: uv run python -m company.assetscan budget . ../../companies/keeper
        working-directory: companies/software-company

  # Canh gác bảo vệ nhánh — ĐỎ cho tới khi ruleset `.github/rulesets/main.json` thật sự có hiệu lực trên `main`.
  # Lý do: cấu hình repo không nằm trong git, nên "đã bật" chỉ là lời hứa nếu không có gì kiểm. Bằng chứng: PR #29
  # merge 23 giây sau khi mở, job `quality` xanh 3 phút SAU merge. Bật ruleset (docs/QUY-TRINH-GIT.md §8) là job này xanh.
  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Bảo vệ nhánh đã có hiệu lực chưa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          rules=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH")
          echo "$rules" > /tmp/live-rules.json
          has_rule()  { jq -e --arg t "$1" 'map(select(.type == $t)) | length > 0' <<<"$rules" >/dev/null; }
          has_check() { jq -e --arg c "$1" '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index($c) != null' <<<"$rules" >/dev/null; }
          fail=0
          # Bốn rule này là bất biến — thiếu bất kỳ cái nào nghĩa là ruleset chưa được áp.
          for t in pull_request required_status_checks deletion non_fast_forward; do
            has_rule "$t" || { echo "::error::Thiếu rule '$t' trên $BRANCH"; fail=1; }
          done
          # Danh sách status check ĐỌC TỪ FILE, không hard-code — thêm/bớt check trong ruleset
          # mà quên sửa chỗ này từng là một nguồn trôi âm thầm.
          for c in $(jq -r '.rules[] | select(.type == "required_status_checks")
                            | .parameters.required_status_checks[].context' .github/rulesets/main.json); do
            has_check "$c" || { echo "::error::Status check '$c' chưa được bắt buộc trên $BRANCH"; fail=1; }
          done
          if [ "$fail" = 1 ]; then
            echo "::error::Bảo vệ nhánh CHƯA có hiệu lực. Import .github/rulesets/main.json: Settings → Rules → Rulesets → New ruleset → Import a ruleset. Chi tiết: docs/QUY-TRINH-GIT.md §8."
            exit 1
          fi
          echo "OK — $BRANCH đang được bảo vệ, và mọi required status check khai trong file đều đã bắt buộc."

      - name: File và ruleset thật phải khớp (đối chiếu hai chiều)
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Vì sao cần vế này: sửa ruleset trong UI có thể LÀM RƠI một rule mà không báo gì.
          # Đã xảy ra thật ngày 2026-09-05 — lần đổi `required_approving_review_count` về 0 làm mất
          # `copilot_code_review`, trong khi guard bản cũ vẫn xanh vì nó chỉ kiểm bốn rule bất biến.
          live=$(jq -r '[.[].type] | sort | unique | .[]' /tmp/live-rules.json)
          want=$(jq -r '[.rules[].type] | sort | unique | .[]' .github/rulesets/main.json)
          fail=0
          for t in $want; do
            grep -qx "$t" <<<"$live" || {
              echo "::error::Rule '$t' có trong .github/rulesets/main.json nhưng KHÔNG áp trên $BRANCH."
              echo "::error::Bảo vệ đang YẾU HƠN thứ repo khai. Bật lại trong Settings → Rules → Rulesets, hoặc bỏ khỏi file nếu đã cố ý không dùng."
              fail=1; }
          done
          for t in $live; do
            grep -qx "$t" <<<"$want" || {
              echo "::warning::Rule '$t' đang áp trên $BRANCH nhưng KHÔNG có trong .github/rulesets/main.json."
              echo "::warning::Không yếu đi, nhưng lần import lại từ file sẽ XOÁ MẤT nó. Thêm vào file cho khớp."; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "OK — mọi rule khai trong file đều đang áp trên $BRANCH."

  # Job tổng hợp — TÊN `quality` LÀ BẤT BIẾN (required status check của branch protection `main`).
  # Thêm job con mới thì phải nối vào `needs` dưới đây, nếu không kết quả của nó không được tính.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [static, unit, eval-replay, audit, keeper-eval-replay, golden-check, gateway-static, gateway-unit, console-static, console-unit, core-static, core-unit, keeper-static, keeper-unit, drift-check, asset-scan, protection-guard]
    if: always()
    steps:
      - name: Kiểm mọi job con đã success
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          # `skipped` cũng là đỏ: job bị bỏ qua (điều kiện `if`, job cha lỗi...) không được tính là qua cổng.
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Có job con không success: $RESULTS" >&2
            exit 1
          fi
