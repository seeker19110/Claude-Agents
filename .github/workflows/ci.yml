name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: software-company
      - run: uv run ruff check src tests
        working-directory: software-company
      - run: uv run mypy src/company --ignore-missing-imports
        working-directory: software-company

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: software-company
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      - run: uv run pytest -q --cov --cov-report=term
        working-directory: software-company

  eval-replay:
    name: eval-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: software-company
      # Eval từ bản ghi (ADR-0010): không gọi model. `--strict` đỏ khi agent có tên trong
      # evals/recordings/REQUIRED.txt mà thiếu bản ghi, hoặc bản ghi ghi ở phiên bản prompt cũ.
      - run: PYTHONPATH=src uv run python -m company.evals all --replay --strict
        working-directory: software-company

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks quét cả lịch sử, không chỉ commit cuối
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Phụ thuộc có CVE đã biết (cả bốn package)
        shell: bash
        run: |
          set -euo pipefail
          for dir in software-company Studio-creators gateway console; do
            echo "::group::pip-audit $dir"
            # Bỏ dòng `-e`: đó là gói cục bộ trong repo (console và hai công ty nó phụ thuộc),
            # PyPI không có nên pip-audit đỏ. Phụ thuộc bên thứ ba của chúng vẫn nằm trong
            # cùng bản export nên không mất phạm vi quét.
            (cd "$dir" && uv export --no-hashes --no-dev | sed '/^-e /d' > /tmp/req-$dir.txt \
              && uvx pip-audit --strict -r /tmp/req-$dir.txt)
            echo "::endgroup::"
          done
      - name: Bí mật lọt vào lịch sử git
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Studio-creators (phòng ban video): cùng cổng lint / unit / eval-replay, package `studio`.
  studio-static:
    name: studio-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: Studio-creators
      - run: uv run ruff check src tests
        working-directory: Studio-creators
      - run: uv run mypy src/studio --ignore-missing-imports
        working-directory: Studio-creators

  studio-unit:
    name: studio-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg   # test ghép video thật; thiếu thì test tự bỏ qua
      - run: uv sync --locked
        working-directory: Studio-creators
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      - run: uv run pytest -q --cov --cov-report=term
        working-directory: Studio-creators

  studio-eval-replay:
    name: studio-eval-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: Studio-creators
      # Eval từ bản ghi (không gọi model). `--strict` đỏ khi agent có tên trong
      # evals/recordings/REQUIRED.txt mà thiếu bản ghi, hoặc bản ghi ghi ở phiên bản prompt cũ.
      - run: PYTHONPATH=src uv run python -m studio.evals all --replay --strict
        working-directory: Studio-creators

  # Golden trong repo phải khớp bản `make golden` sinh ra: chặn "sửa agent rồi quên commit lại golden".
  golden-check:
    name: golden-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: software-company
          - dir: Studio-creators
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: ${{ matrix.dir }}
      - run: UPDATE_GOLDEN=1 uv run pytest -q tests/test_golden_agents.py
        working-directory: ${{ matrix.dir }}
      - name: Golden đã commit có khớp không
        run: |
          if ! git diff --exit-code -- ${{ matrix.dir }}; then
            echo "::error::Golden lệch — chạy \`make golden\` trong ${{ matrix.dir }} rồi commit lại" >&2
            exit 1
          fi

  gateway-static:
    name: gateway-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: gateway
      - run: uv run ruff check src tests
        working-directory: gateway
      - run: uv run mypy src/gateway --ignore-missing-imports
        working-directory: gateway

  gateway-unit:
    name: gateway-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: gateway
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      - run: uv run pytest -q --cov --cov-report=term
        working-directory: gateway

  # console (trực ban hợp nhất): chỉ stdlib, phụ thuộc hai công ty qua path dependency.
  console-static:
    name: console-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: console
      - run: uv run ruff check src tests
        working-directory: console
      - run: uv run mypy src/console --ignore-missing-imports
        working-directory: console

  console-unit:
    name: console-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # cận dưới của requires-python và bản mới nhất đang dùng
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: console
      # Ngưỡng coverage nằm trong pyproject (fail_under): chặn tụt lùi, không phải chỉ tiêu thành tích.
      - run: uv run pytest -q --cov --cov-report=term
        working-directory: console

  # Tài sản prompt của repo là chuỗi cung ứng (ADR-0022): injection, ký tự ẩn, lệnh nguy hiểm, khóa lộ
  # trong `agents/ skills/ templates/ gates/ topics/` của CẢ HAI công ty. Miễn trừ: assetscan-waivers.txt.
  asset-scan:
    name: asset-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: software-company
      - run: PYTHONPATH=src uv run python -m company.assetscan scan . ../Studio-creators
        working-directory: software-company
      # Prompt tĩnh không được ăn quá nửa ngân sách token của chính agent đó, và skill khai phải tồn tại.
      - run: PYTHONPATH=src uv run python -m company.assetscan budget . ../Studio-creators
        working-directory: software-company

  # Job tổng hợp — TÊN `quality` LÀ BẤT BIẾN (required status check của branch protection `main`).
  # Thêm job con mới thì phải nối vào `needs` dưới đây, nếu không kết quả của nó không được tính.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [static, unit, eval-replay, audit, studio-static, studio-unit, studio-eval-replay, golden-check, gateway-static, gateway-unit, console-static, console-unit, asset-scan]
    if: always()
    steps:
      - name: Kiểm mọi job con đã success
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          # `skipped` cũng là đỏ: job bị bỏ qua (điều kiện `if`, job cha lỗi...) không được tính là qua cổng.
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Có job con không success: $RESULTS" >&2
            exit 1
          fi
