name: Quality integration source snapshot
on:
  push:
    branches: [feat/product-quality-harness]
    paths: [.github/workflows/quality-source-snapshot.yml]
permissions:
  contents: read
jobs:
  finalize-transfer:
    if: github.repository == 'seeker19110/Claude-Agents' && github.ref == 'refs/heads/feat/product-quality-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify documentation edit and remove one-time helpers
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          def blob(b):
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          p = Path('docs/PRODUCT-EXCELLENCE.md')
          assert blob(p.read_bytes()) == '2bc05b6d0c5bf4b7f335439a7bbc8e22f1be376f'
          s = p.read_text(encoding='utf-8')
          old = 'là policy v1 nội bộ'
          assert old in s
          s = s.replace(old, 'là policy `product-excellence/2` nội bộ')
          old = '`{principal_id, mode, allowed_checks, key_file}`; key_file chỉ tới file nhị phân bí mật do coordinator cấp.'
          assert old in s
          s = s.replace(old, old + '\n`mode` là `runner` hoặc `independent_review`; bề mặt ứng dụng di động là `mobile_app`. Các nhãn này\nkhông phải ID agent hoặc pha builder; không thay đổi registry sáu agent đang vận hành.')
          assert blob(s.encode()) == '46a0ee799278a3935a9a5feaa4df905997e58238'
          p.write_bytes(s.encode())
          PY
          git diff --check
          git add -- docs/PRODUCT-EXCELLENCE.md
          git rm -- .github/workflows/quality-source-snapshot.yml .integration/assemble.py .integration/transfer.json
          git -c user.name=seeker19110 -c user.email=29851712+seeker19110@users.noreply.github.com commit -m 'docs: synchronize product policy vocabulary and remove one-time transfer helpers'
          git push origin HEAD:refs/heads/feat/product-quality-harness
