name: Quality integration source snapshot
on:
  push:
    branches: [feat/product-quality-harness]
    paths: [.github/workflows/quality-source-snapshot.yml]
permissions:
  contents: read
jobs:
  metadata-fix:
    if: github.repository == 'seeker19110/Claude-Agents' && github.ref == 'refs/heads/feat/product-quality-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Fix one verified documentation marker on the auxiliary branch
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('CHANGELOG.md')
          def blob(b):
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          assert blob(p.read_bytes()) == '6add57b58e01160be83cdfd6c1e27f8da6128fd6'
          s = p.read_text(encoding='utf-8')
          assert s.count('(ADR gốc 0018; #335)') == 1
          p.write_text(s.replace('(ADR gốc 0018; #335)', '(ADR gốc 0018) (#335)', 1), encoding='utf-8')
          assert blob(p.read_bytes()) == 'f51381e31326989ac22043700c13ba8e4d03200d'
          PY
          git diff --check
          git add -- CHANGELOG.md
          git -c user.name=seeker19110 -c user.email=29851712+seeker19110@users.noreply.github.com commit -m 'docs: use the required changelog PR-reference format'
          git push origin HEAD:refs/heads/feat/product-quality-harness
