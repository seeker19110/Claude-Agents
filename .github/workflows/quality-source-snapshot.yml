name: Quality integration source snapshot
on:
  push:
    branches: [feat/product-quality-harness]
    paths: [.github/workflows/quality-source-snapshot.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'seeker19110/Claude-Agents' && github.ref == 'refs/heads/feat/product-quality-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assemble reviewed bytes and push only the auxiliary branch
        run: python .integration/assemble.py
      - name: Export assembled source for verification
        run: git archive --format=zip --output=/tmp/claude-agents-assembled.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: quality-integration-assembled-source
          path: /tmp/claude-agents-assembled.zip
          retention-days: 1
          if-no-files-found: error
