name: One-time template adoption transfer
on:
  push:
    branches: [chore/template-adoption-transfer]
    paths: [.github/workflows/template-adoption-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'seeker19110/Claude-Agents' && github.ref == 'refs/heads/chore/template-adoption-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed patch, verify tree and remove transport files
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          import subprocess
          from pathlib import Path
          branch = 'chore/template-adoption-transfer'
          assert os.environ['GITHUB_REPOSITORY'] == 'seeker19110/Claude-Agents'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          raw = ''.join(Path('.integration/adoption-' + str(i) + '.txt').read_text().strip() for i in (1, 2))
          patch = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'eeeee55bbf858130a2519ab840e92fd3262f6ce5247351d5889cc5ac3db86241'
          git('apply', '--unidiff-zero', '--check', '-', input=patch)
          git('apply', '--unidiff-zero', '-', input=patch)
          files = [
              '.claude/commands/product-goal.md', 'AGENTS.md', 'CHANGELOG.md', 'CODEMAP.md', 'README.md',
              'companies/software-company/README.md',
              'companies/software-company/docs/adr/0045-selective-template-delivery.md',
              'companies/software-company/examples/product-quality-profile.json',
              'companies/software-company/src/company/delivery_contract.py',
              'companies/software-company/src/company/product_quality.py',
              'companies/software-company/tests/test_delivery_contract.py',
              'docs/PRODUCT-EXCELLENCE.md', 'docs/integrations/projects-template.lock.json',
              'docs/reports/2026-09-25-projects-template-adoption.md',
              'docs/sessions/2026-09-25-template-adoption.md', 'docs/thi-hanh/productexcellence.md',
          ]
          git('diff', '--check')
          git('add', '--', *files)
          git('rm', '--', '.integration/adoption-1.txt', '.integration/adoption-2.txt',
              '.github/workflows/template-adoption-transfer.yml')
          tree = git('write-tree').decode().strip()
          assert tree == '14bf194c71fc654d0c9163e1133ac464dd722646', tree
          git('-c', 'user.name=seeker19110', '-c', 'user.email=29851712+seeker19110@users.noreply.github.com',
              'commit', '-m', 'feat(company): assemble verified selective template adoption')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          print('VERIFIED_TREE', tree)
          print('ASSEMBLED_COMMIT', git('rev-parse', 'HEAD').decode().strip())
          PY
