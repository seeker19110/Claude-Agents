name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  # TÊN `metadata` LÀ BẤT BIẾN (required status check của branch protection `main`).
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Tiêu đề PR theo Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|docs|test|chore|style|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Tiêu đề PR sai quy ước: $TITLE" >&2
            echo "Mẫu đúng: feat(software-company): thêm cổng eval" >&2
            echo "Lưu ý: scope chỉ nhận chữ thường." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR phải có dòng CHANGELOG.md (nhãn no-changelog để miễn)
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in *,no-changelog,*) echo "miễn theo nhãn no-changelog"; exit 0;; esac
          git fetch -q origin "$BASE"
          if git diff --quiet "origin/$BASE...HEAD" -- CHANGELOG.md; then
            echo "PR không đổi CHANGELOG.md. Thêm một dòng ở 'Chưa phát hành' (AGENTS.md luật bắt buộc 9), hoặc gắn nhãn no-changelog." >&2
            exit 1
          fi
