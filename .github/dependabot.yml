version: 2
updates:
  - package-ecosystem: uv
    directory: /software-company
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: uv
    directory: /Studio-creators
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: uv
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
