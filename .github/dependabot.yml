version: 2
updates:
  # MỘT mục `uv` duy nhất, trỏ vào GỐC workspace — không phải sáu mục theo từng package.
  #
  # Repo là một uv workspace: sáu `pyproject.toml` con nhưng CHỈ MỘT `uv.lock` ở gốc. Cấu hình cũ đặt
  # `directory` là từng package, mà `uv.lock` nằm NGOÀI mọi thư mục đó, nên dependabot không bao giờ chạm
  # tới nó: mỗi PR nó mở chỉ đổi `pyproject.toml` con và để lock cũ nguyên. Toàn bộ CI chạy
  # `uv sync --locked`, lệnh này ĐỎ khi lock không khớp pyproject — nên chín PR mở ngày 2026-09-09
  # (#228-#236) hỏng do CẤU TRÚC, không phải do nội dung bản nâng.
  #
  # Trỏ vào gốc thì dependabot thấy cả workspace và cập nhật manifest thành viên CÙNG `uv.lock` trong một PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # Cổng `metadata` (pr-policy.yml) đòi mọi PR có dòng CHANGELOG, và miễn theo nhãn `no-changelog`.
    # Dependabot không viết CHANGELOG được, nên thiếu nhãn này là MỌI PR nó mở đều đỏ ở `metadata` —
    # đo được ở #246: 35/36 check xanh, chỉ `metadata` đỏ đúng vì lý do đó. Cùng quy ước với PR do
    # `eval-record.yml` tự tạo (nó đã gắn `no-changelog` từ trước).
    # `labels` THAY THẾ bộ nhãn mặc định, nên phải liệt kê lại cả `dependencies`.
    labels: ["dependencies", "no-changelog"]
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "no-changelog"]
