[project]
name = "console"
version = "0.1.0"
description = "Console điều hành hợp nhất cho các công ty AI của X-Agents"
requires-python = ">=3.11"
# Không có phụ thuộc runtime ngoài hai công ty: server dùng thư viện chuẩn (http.server, sqlite3).
dependencies = [
    "software-company",
    "video-creators",
]

[tool.uv.sources]
software-company = { workspace = true }
video-creators = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: cùng quy ước viết gọn một dòng như hai công ty. RUF001-003: ký tự Unicode tiếng Việt.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/console"]

[tool.coverage.report]
# Cả bốn package phủ 100% dòng: ngưỡng bằng đúng mức đạt được, nên mất một dòng phủ là CI đỏ.
# Nhánh phụ thuộc nền tảng (os.name == "nt", AF_INET6) được test bằng cách thay socket/ctypes, không bằng môi trường.
fail_under = 100
